name: app_medicare
description: "Hopes – your complete healthcare companion."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.5.0
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.3.5

  # Navigation
  go_router: ^14.6.3

  # Networking
  dio: ^5.7.0
  pretty_dio_logger: ^1.4.0

  # Payments
  razorpay_flutter: ^1.3.7

  # Local DB (offline-first)
  drift: ^2.21.0
  sqlite3_flutter_libs: ^0.5.29
  path_provider: ^2.1.5
  path: ^1.9.0

  # Secure storage
  flutter_secure_storage: ^9.2.4

  # First-launch / preferences
  shared_preferences: ^2.3.3

  # Connectivity
  connectivity_plus: ^6.1.1

  # Notifications & Alarms
  flutter_local_notifications: ^18.0.1
  android_alarm_manager_plus: ^4.0.3
  flutter_foreground_task: ^8.14.0
  wakelock_plus: ^1.2.8
  audioplayers: ^6.4.0
  firebase_core: ^3.3.0
  firebase_messaging: ^15.0.4

  # Permissions
  permission_handler: ^11.3.1

  # Location
  geolocator: ^13.0.2
  geocoding: ^3.0.0

  # Map (OpenStreetMap — free, no API key / billing)
  flutter_map: ^7.0.2
  latlong2: ^0.9.1

  # Images & Media
  cached_network_image: ^3.4.1
  image_picker: ^1.1.2
  file_picker: ^8.1.7
  flutter_svg: ^2.0.13
  photo_view: ^0.15.0
  video_player: ^2.9.3

  # UI / UX
  shimmer: ^3.0.0
  lottie: ^3.3.1
  animations: ^2.0.11
  flutter_animate: ^4.5.2
  google_fonts: ^6.2.1

  # Charts
  fl_chart: ^0.70.2

  # Forms
  pin_code_fields: ^8.0.1
  flutter_otp_text_field: ^1.1.3
  intl: ^0.19.0

  # Utils
  uuid: ^4.5.1
  equatable: ^2.0.7
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  collection: ^1.18.0
  dartz: ^0.10.1

  # Sharing
  share_plus: ^10.1.3
  url_launcher: ^6.3.1

  # PDF
  flutter_pdfview: ^1.3.2

  # Voice search
  speech_to_text: ^7.0.0

  # Text-to-speech (medicine reminder voice alerts)
  flutter_tts: ^4.1.0

  # Timezone support for scheduled notifications
  timezone: ^0.9.4

  # Biometrics
  local_auth: ^2.3.0

  # Haptics / device
  vibration: ^2.0.1
  device_info_plus: ^11.5.0
  package_info_plus: ^8.0.0
  flutter_timezone: ^5.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.13
  riverpod_generator: ^2.4.3
  freezed: ^2.5.7
  json_serializable: ^6.8.0
  drift_dev: ^2.21.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/app_icon.png"
  remove_alpha_ios: true
  min_sdk_android: 21

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/
    - assets/sounds/
    # Bundled Inter + Space Grotesk — google_fonts loads these from the asset
    # manifest instead of fetching them over the network at runtime.
    - assets/fonts/
